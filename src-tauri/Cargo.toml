[package]
name = "reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset",
    "tray-icon",
    "unstable",
    "webview-data-url",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.44"
boa_engine = "0.21.0"
tauri-plugin-prevent-default = { version = "4.0.4", features = [
    "platform-windows",
] }
encoding_rs = "0.8.35"
# TLS：桌面用 native-tls（Windows SChannel）；Android 用 rustls，避免交叉编译依赖 OpenSSL
reqwest = { version = "0.13.2", default-features = false, features = [
    "blocking",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
base64 = "0.22.1"
uuid = { version = "1.21.0", features = ["v4"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "fs", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
global-hotkey = "0.6"
aes = "0.8"
des = "0.8"
ecb = "0.1"
tauri-plugin-log = "2.8.0"
log = "0.4"
url = "2.5.8"
regex = "1.11"
zip = "8.6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tempfile = "3"
tauri-plugin-store = "2.4.2"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-autostart = "2.5.1"
http = "1.4.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-http = { version = "2.5.7", features = [
    "dangerous-settings",
    "unsafe-headers",
] }
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-process = "2"
if-addrs = "0.14.0"
sha1 = "0.10.6"
md-5 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
sha2 = "0.10"
flate2 = "1"
urlencoding = "2"

ffmpeg-next = { version = "7.1", optional = true, default-features = false, features = [
    "static",
    "format",
    "codec",
    "software-resampling",
] }
# 桌面增强核：需本机或 PATH 可链的 libmpv 2.x（见 docs/VIDEO_PLAYBACK_KERNEL.md）
libmpv2 = { version = "6", optional = true }

# Windows 大型 Tauri 工程在 debug=2 时易触发 LINK LNK1318（PDB 超限）
[profile.dev]
debug = 1

[features]
default = []
# 可选：启用 Rust 音频转码（ffmpeg-next 静态链接，显著增加包体与编译时间）
# cargo build --features media-ffmpeg
media-ffmpeg = ["dep:ffmpeg-next"]
# 可选：内嵌 libmpv2 增强播放核（GPL；勿用 ParadoxSpiral/libmpv-rs）
# 见 docs/VIDEO_LIBMPV_LICENSE.md · docs/VIDEO_PLAYBACK_KERNEL.md
# Windows：链接需 mpv.lib，运行需 libmpv-2.dll（resources/libmpv 或 MPV_LIB_DIR）
# 示例：.\scripts\bundle-libmpv.ps1 后  cargo build --features video-libmpv
# 可选：内嵌 libmpv2 增强播放核（GPL；勿用 ParadoxSpiral/libmpv-rs）
# 见 docs/VIDEO_LIBMPV_LICENSE.md · docs/VIDEO_PLAYBACK_KERNEL.md
# Windows：链接需 mpv.lib，运行需 libmpv-2.dll（resources/libmpv 或 MPV_LIB_DIR）
# 示例：.\scripts\bundle-libmpv.ps1 后  cargo build --features video-libmpv
video-libmpv = ["dep:libmpv2"]
# 拆封装 HTTP（门禁 B）：复用 ffmpeg-next
video-demux = ["media-ffmpeg"]
# 原生增强窗（门禁 C，可砍）：v1 软解；wgpu/ort 另开 spike 后再加 dep
video-native-enhance = []

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "28"
reader-display-native = { path = "android/display-reader" }
reader-music-media-native = { path = "android/music-media" }
reader-tv-spider-native = { path = "android/tv-spider" }
reader-video-player-native = { path = "android/video-player" }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_Display",
    "Win32_System_IO",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
